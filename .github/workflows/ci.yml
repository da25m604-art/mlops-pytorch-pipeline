name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchvision==0.23.0
          pip install PyYAML==6.0.2 numpy==2.1.3 pytest==8.3.4 ruff==0.8.4

      - name: lint
        run: ruff check src tests

      - name: run tests
        run: pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build training image
        run: docker build -f docker/Dockerfile.train -t mlops-train:ci .
      - name: build serving image
        run: docker build -f docker/Dockerfile.serve -t mlops-serve:ci .
